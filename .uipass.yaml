schema_version: 1
app:
  serve: [.venv/bin/python, scripts/uipass_fixture.py, "{port}"]
  ready_path: /bins/
viewports:
  narrow: {width: 320, height: 720}
  phone: {width: 390, height: 844}
  desktop: {width: 1280, height: 800}
surfaces:
  catalog:
    states:
      populated: {route: /bins/, ready: h1}
      no_match: {route: "/bins/?q=no-such-bin", ready: h1}
      details_open:
        route: /bins/
        ready: h1
        actions:
          - {type: click, selector: ".bin-catalog-card:first-child .bin-catalog-details > summary"}
      review_open:
        route: /bins/
        ready: h1
        actions:
          - {type: click, selector: ".bin-label-review-panel > summary"}
  photo_drop:
    states:
      form: {route: /, ready: h1}
      options_open:
        route: /
        ready: h1
        actions:
          - {type: click, selector: ".bin-photo-options > summary"}
  register:
    states:
      form: {route: /register, ready: h1}
  manage:
    states:
      pending_review: {route: /manage/AGR-014, ready: h1}
      location_jump:
        route: /manage/AGR-014
        ready: "#location"
        actions:
          - {type: click, selector: ".bin-manage-jumps a[href='#location']"}
