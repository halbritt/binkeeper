schema_version: 1
app:
  serve: [.venv/bin/python, scripts/uipass_fixture.py, "{port}"]
  ready_path: /bins/
viewports:
  narrow: {width: 320, height: 720}
  phone: {width: 390, height: 844}
  desktop: {width: 1280, height: 800}
surfaces:
  catalog:
    states:
      populated: {route: /bins/, ready: h1}
      no_match: {route: "/bins/?q=no-such-bin", ready: h1}
      details_open:
        route: /bins/
        ready: h1
        actions:
          - {type: click, selector: ".bin-catalog-card:first-child .bin-catalog-details > summary"}
      review_open:
        route: /bins/
        ready: h1
        actions:
          - {type: click, selector: ".bin-label-review-panel > summary"}
  photo_drop:
    states:
      form: {route: /, ready: h1}
      label_prefilled:
        route: /
        ready: h1
        actions:
          - {type: fill, selector: "#prefill-theme", value: "MY WORKBENCH"}
      options_open:
        route: /
        ready: h1
        actions:
          - {type: click, selector: ".bin-photo-options > summary"}
  quick_label:
    states:
      form: {route: /quick-label, ready: h1}
  photo_result:
    states:
      proposed: {route: /fixture/photo-result, ready: h1}
      label_prefilled: {route: "/fixture/photo-result?prefill=label", ready: h1}
      both_prefilled: {route: "/fixture/photo-result?prefill=both", ready: h1}
      vision_failure: {route: "/fixture/photo-result?failure=true", ready: h1}
      storage_and_vision_failure:
        route: "/fixture/photo-result?failure=true&stored=false"
        ready: h1
  register:
    states:
      form: {route: /register, ready: h1}
  saved_photos:
    states:
      populated: {route: /saved-photos, ready: h1}
      selected:
        route: /saved-photos
        ready: h1
        actions:
          - {type: click, selector: ".bin-saved-photo:first-child input"}
      both_prefilled:
        route: /saved-photos
        ready: h1
        actions:
          - {type: click, selector: ".bin-saved-photo:first-child input"}
          - {type: fill, selector: "#prefill-theme", value: "MY WORKBENCH"}
          - {type: fill, selector: "#prefill-contents", value: "Hex keys and calipers"}
      empty: {route: "/saved-photos?offset=24", ready: h1}
      unavailable: {route: "/saved-photos?offset=48", ready: h1}
  manage:
    states:
      pending_review: {route: /manage/AGR-014, ready: h1}
      location_jump:
        route: /manage/AGR-014
        ready: "#location"
        actions:
          - {type: click, selector: ".bin-manage-jumps a[href='#location']"}
