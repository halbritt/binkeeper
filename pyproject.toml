[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binkeeper"
version = "0.1.0"
description = "Local-first physical inventory system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42,<47",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "Pillow>=10,<13",
    "psycopg[binary]>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "pyzbar>=0.1.9,<1",
    "qrcode>=7,<9",
    "uvicorn>=0.34,<1",
]

[project.scripts]
binkeeper-migrate = "binkeeper.migrations:main"
binkeeper-transfer = "binkeeper.transfer:main"
binkeeper = "binkeeper.cli:main"
binkeeper-mcp-stdio = "binkeeper.mcp_stdio:main"
binkeeper-serve = "binkeeper.service:main"
binkeeper-backup = "binkeeper.backup_cli:main"
binkeeper-restore-drill = "binkeeper.restore_drill:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "pyright>=1.1.380,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "setuptools>=69",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"binkeeper.catalog" = ["templates/*"]
"binkeeper.bin_catalog_web" = ["templates/*"]
"binkeeper.bin_photo_web" = ["templates/*"]
"binkeeper.photo" = ["templates/*"]
"binkeeper.web" = ["templates/*", "static/*"]
"binkeeper.migrations" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "migration: exercises the standalone migration surface",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
ignore = ["tests/test_bin_*.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportGeneralTypeIssues = "warning"
